name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intel-macos:
    runs-on: macos-15-intel
    timeout-minutes: 25
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go mod verify
      - name: Test, including offline MCP smoke
        run: go test -mod=readonly ./...
      - name: Race detector
        run: CGO_ENABLED=1 go test -mod=readonly -race ./...
      - run: go vet -mod=readonly ./...
      - name: Verify Intel package
        run: |
          set -euo pipefail
          smoke="$(mktemp -d "$RUNNER_TEMP/ahenk-package.XXXXXXXX")"
          trap 'rm -rf "$smoke"' EXIT
          mkdir "$smoke/first" "$smoke/second"

          package=ahenk-darwin-amd64
          archive="$package.tar.gz"
          source_sha="$(git rev-parse HEAD)"
          for build in first second; do
            make dist
            mv "dist/$archive" "$smoke/$build/"
            tar -xzf "$smoke/$build/$archive" -C "$smoke/$build"
          done
          first_sha="$(shasum -a 256 "$smoke/first/$archive" | awk '{print $1}')"
          second_sha="$(shasum -a 256 "$smoke/second/$archive" | awk '{print $1}')"
          test -n "$first_sha"
          test "$first_sha" = "$second_sha"
          diff -qr "$smoke/first/$package" "$smoke/second/$package"

          AHENK_PACKAGE_BINARY="$smoke/first/$package/ahenk" \
            AHENK_PACKAGE_SOURCE_SHA="$source_sha" \
            AHENK_PACKAGE_SHA_FIRST="$first_sha" \
            AHENK_PACKAGE_SHA_SECOND="$second_sha" \
            go test -mod=readonly ./cmd/ahenk -run '^TestIntelPackageMCPContract$' -count=1 -v
