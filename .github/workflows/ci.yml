name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intel-macos:
    runs-on: macos-15-intel
    timeout-minutes: 25
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go mod verify
      - name: Test, including offline MCP smoke
        run: go test -mod=readonly ./...
      - name: Race detector
        run: CGO_ENABLED=1 go test -mod=readonly -race ./...
      - run: go vet -mod=readonly ./...
      - name: Verify Intel package
        run: |
          make dist
          tar -xzf dist/ahenk-darwin-amd64.tar.gz -C "$RUNNER_TEMP"
          package="$RUNNER_TEMP/ahenk-darwin-amd64"
          test -x "$package/ahenk"
          "$package/ahenk" --version
          cmp LICENSE "$package/LICENSE"
          cmp docs/third-party-licenses.md "$package/THIRD_PARTY.md"
          test -s "$package/licenses/go/LICENSE"
